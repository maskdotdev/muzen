[package]
name = "muzen"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.22.1"
blake3 = "1.8.2"
cap-std = "3.4.5"
clap = { version = "4.5.51", features = ["derive"] }
dashmap = "6.1.0"
futures = "0.3.31"
hmac = "0.12.1"
ignore = "0.4.25"
libc = "0.2.177"
libsql = { version = "0.9", default-features = false, features = ["core"] }
memchr = "2.7.6"
moka = { version = "0.12.11", features = ["future"] }
num_cpus = "1.17.0"
parking_lot = "0.12.5"
rayon = "1.11.0"
regex = "1.12.2"
reqwest = { version = "0.12.26", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.17"
uuid = { version = "1.23.2", features = ["v4"] }
tempfile = "3.23.0"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
ort = "2.0.0-rc.10"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
