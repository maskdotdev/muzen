[package]
name = "muzen"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.4"
blake3 = "1.8.2"
cap-std = "3.4.5"
clap = { version = "4.5.51", features = ["derive"] }
dashmap = "6.1.0"
futures = "0.3.31"
hmac = "0.12.1"
ignore = "0.4.25"
libc = "0.2.177"
memchr = "2.7.6"
moka = { version = "0.12.11", features = ["future"] }
num_cpus = "1.17.0"
parking_lot = "0.12.5"
rayon = "1.11.0"
regex = "1.12.2"
reqwest = { version = "0.12.26", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.17"

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
